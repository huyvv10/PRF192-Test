name: FPT Auto Grade C

on:
  push:
  pull_request:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Make script executable
        run: chmod +x scripts/grade_all.sh

      - name: Run grading
        run: bash scripts/grade_all.sh

      - name: Save score
        run: echo "Score saved"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt
